name: Update profile README assets

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Fetch public contribution data
        run: python scripts/fetch_contributions.py --username pml0107

      - name: Regenerate contribution SVG
        run: python scripts/generate_contributions.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/contribution-graph.svg
          if git diff --cached --quiet; then
            echo "No profile asset changes to commit."
          else
            git commit -m "chore: update contribution graph [skip ci]"
            git push
          fi

